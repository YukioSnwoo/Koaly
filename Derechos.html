<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derechos Humanos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fa;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 2rem;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }

        video {
            display: block;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 1.5rem auto;
            border-radius: 12px;
            background: #000000;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        p {
            text-align: center;
            color: #475569;
            font-size: 1.15rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Derechos Humanos</h1>

        <video controls>
            <source src="Los Derechos Humanos.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>

        <p>
            Ya puedes hablar con los Derechos Humanos.
        </p>

    </div>

</body>
</html>
