<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cajero.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">Koaly</div>
        <div class="store-info">Tel. Oficina 00 000 0000</div>
        <div class="cashier-info"><span id="userName">NombreX NombreX</span><small>ApellidoX ApellidoX</small></div>
        <div class="avatar">IMG</div>
    </header>
    <main class="pos-layout">
        <aside class="sidebar">
            <button class="side-button active" type="button" data-action="search">Buscar producto</button>
            <button class="side-button" type="button" data-action="key">Buscar Producto (ID)</button>
            <button class="side-button" type="button" data-action="coupon">Cupon</button>
            <button class="side-button" type="button" data-action="points">Agregar tarjeta de puntos</button>
            <div class="side-spacer"></div>
            <button class="danger-button" id="clearCart" type="button">Eliminar</button>
            <button class="orange-button" id="clearSearch" type="button">Limpiar</button>
        </aside>
        <section class="catalog-panel">
            <div class="catalog-heading">
                <div>
                    <span class="eyebrow">Nueva venta</span>
                    <h1>Productos</h1>
                </div>
                <form id="searchForm" class="catalog-search" role="search">
                    <label class="sr-only" for="productSearch">Buscar producto</label>
                    <input id="productSearch" name="buscar" type="search" placeholder="Buscar producto o clave" autocomplete="off">
                    <button type="submit" aria-label="Buscar">Buscar</button>
                </form>
            </div>
            <p class="catalog-message" id="emptyState">Escribe un nombre o clave para filtrar el catálogo.</p>
            <div class="product-grid" id="productGrid"></div>
        </section>
        <aside class="checkout-panel">
            <h2>Precios</h2>
            <div class="cart-list" id="cartList">
                <p class="cart-empty">Selecciona un producto</p>
            </div>
            <div class="totals">
                <div><span>Subtotal:</span><strong id="subtotal">$0.00</strong></div>
                <div><span>Descuento:</span><strong id="discount">$0.00</strong></div>
                <div><span>Impuestos:</span><strong id="tax">$0.00</strong></div>
                <div class="savings"><span>Te ahorras:</span><strong id="savings">$0.00</strong></div>
                <div class="total"><span>Total:</span><strong id="total">$0.00</strong></div>
            </div>
            <button class="pay-button" type="button" id="payButton">Pagar</button>
        </aside>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="cajero.js"></script>
</body>
</html>
