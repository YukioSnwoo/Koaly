<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        
        <div id="loginMessage" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Correo electrónico</label>
                <input type="email" id="loginEmail" placeholder="tú@empresa.com" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
                <div id="loginStrengthWarning" class="strength-warning" aria-live="polite"></div>
            </div>

            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
